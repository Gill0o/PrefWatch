name: Validate Script

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  # prefwatch.sh and merge-to-main.sh are zsh: ShellCheck refuses them (SC1071),
  # so they get `zsh -n` below. Only the bash helpers are linted, and strictly.
  shellcheck:
    name: ShellCheck Validation (bash helpers)
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: brew install shellcheck

    - name: Run ShellCheck on release.sh and pre-commit
      run: |
        for f in release.sh pre-commit; do
          if [ -f "$f" ]; then
            echo "Running ShellCheck on $f..."
            shellcheck "$f"
          else
            echo "$f not present (main branch), skipping"
          fi
        done

  syntax-check:
    name: Bash/Zsh Syntax Check
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Zsh syntax (prefwatch.sh)
      run: |
        echo "Checking Zsh syntax on prefwatch.sh..."
        zsh -n prefwatch.sh

    - name: Check Zsh syntax (merge-to-main.sh)
      run: |
        if [ -f merge-to-main.sh ]; then
          zsh -n merge-to-main.sh
        else
          echo "merge-to-main.sh not present (main branch), skipping"
        fi

    - name: Check Bash syntax (release.sh, pre-commit)
      run: |
        for f in release.sh pre-commit; do
          if [ -f "$f" ]; then
            echo "Checking Bash syntax on $f..."
            bash -n "$f"
          else
            echo "$f not present (main branch), skipping"
          fi
        done

  version-check:
    name: Version Consistency Check
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from script
      id: script_version
      run: |
        VERSION=$(grep -m 1 "^# Version:" prefwatch.sh | awk '{print $3}')
        echo "script_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Script version: $VERSION"

    - name: Extract version from CHANGELOG
      id: changelog_version
      run: |
        VERSION=$(grep -m 1 "^## " CHANGELOG.md | awk '{print $2}')
        echo "changelog_version=$VERSION" >> $GITHUB_OUTPUT
        echo "CHANGELOG version: $VERSION"

    - name: Compare versions
      run: |
        if [ "${{ steps.script_version.outputs.script_version }}" != "${{ steps.changelog_version.outputs.changelog_version }}" ]; then
          echo "::warning::Version mismatch! Script: ${{ steps.script_version.outputs.script_version }}, CHANGELOG: ${{ steps.changelog_version.outputs.changelog_version }}"
        else
          echo "✓ Versions match: ${{ steps.script_version.outputs.script_version }}"
        fi

  basic-tests:
    name: Basic Functionality Tests
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Make script executable
      run: chmod +x prefwatch.sh

    # A run never ends on its own (it watches until killed), and macOS has no
    # `timeout`: the old step failed with 127 under `|| true` and tested nothing.
    - name: Test help output
      run: |
        out=$(./prefwatch.sh -h)
        printf '%s\n' "$out" | head -3
        printf '%s\n' "$out" | grep -q '^Usage: prefwatch.sh'

    - name: Test that invalid parameters are refused
      run: |
        if ./prefwatch.sh "" >/dev/null 2>&1; then echo "::error::empty domain accepted"; exit 1; fi
        if ./prefwatch.sh --bogus-flag >/dev/null 2>&1; then echo "::error::unknown flag accepted"; exit 1; fi
        echo "✓ empty domain and unknown flag refused"

    - name: Verify required commands exist
      run: |
        echo "Checking for required macOS commands..."
        which defaults
        which plutil
        which PlistBuddy || which /usr/libexec/PlistBuddy
        which mktemp
        which date

  documentation-check:
    name: Documentation Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for README
      run: |
        if [ ! -f README.md ]; then
          echo "::error::README.md is missing"
          exit 1
        fi
        echo "✓ README.md exists"

    - name: Check for CHANGELOG
      run: |
        if [ ! -f CHANGELOG.md ]; then
          echo "::error::CHANGELOG.md is missing"
          exit 1
        fi
        echo "✓ CHANGELOG.md exists"

    - name: Check for LICENSE
      run: |
        if [ ! -f LICENSE ]; then
          echo "::error::LICENSE is missing"
          exit 1
        fi
        echo "✓ LICENSE exists"

    - name: Check for CONTRIBUTING
      run: |
        if [ ! -f CONTRIBUTING.md ]; then
          echo "::warning::CONTRIBUTING.md is missing"
        else
          echo "✓ CONTRIBUTING.md exists"
        fi

    - name: Validate markdown
      uses: DavidAnson/markdownlint-cli2-action@v19
      with:
        globs: '*.md'
        config: |
          {
            "MD013": false,
            "MD033": false,
            "MD041": false
          }
      continue-on-error: true

